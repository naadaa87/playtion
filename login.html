<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로그인 · 마이페이지 — 플레이션 게임파티룸</title>
<meta name="description" content="간편 로그인하고 내 예약, 레벨, 포인트를 확인하세요.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect x='2' y='10' width='36' height='22' rx='8' fill='%236D3BFF'/%3E%3Crect x='9' y='17' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='6' y='19.5' width='9' height='4' rx='1' fill='white'/%3E%3Ccircle cx='28' cy='18.6' r='2.4' fill='%23FFD84D'/%3E%3Ccircle cx='32.6' cy='23.2' r='2.4' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="wrap">
    <span class="hud">Player Login</span>
    <h1 class="d1"><span class="vio">플레이어</span> 접속</h1>
    <p class="lead">로그인하면 예약 내역과 내 레벨, 포인트를 한눈에 볼 수 있어요.</p>
  </div>
</section>

<section class="sec" id="loginApp">
  <div class="wrap" style="max-width:640px">

    <!-- 로그인 -->
    <div id="loginBox">
      <form class="panel rv" id="loginForm">
        <span class="hud plain px" style="color:var(--violet)">CONTINUE?</span>
        <h2 class="d3" style="margin:8px 0 18px">간편 로그인</h2>
        <div class="field"><label for="loginName">이름 <span class="req">*</span></label>
          <input type="text" id="loginName" placeholder="예) 홍길동" autocomplete="name"></div>
        <div class="field"><label for="loginTel">휴대폰 번호 <span class="req">*</span></label>
          <input type="tel" id="loginTel" placeholder="01012345678" autocomplete="tel">
          <p class="hint">예약 시 사용한 번호로 로그인하면 예약 내역이 연결돼요.</p></div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">로그인 ▶</button>
        <div class="demo-note" style="margin-top:16px">지금은 온라인 예약 오픈을 준비 중이라 데모로 로그인이 진행돼요. 인증번호 없이 이 기기에서만 로그인 상태가 유지돼요.</div>
      </form>
      <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button class="btn" style="flex:1 1 150px;min-width:0;background:#FEE500;color:#191919;font-weight:800" onclick="window.PLT.toast('카카오 로그인은 정식 오픈 때 만나요!')">💛 카카오로 시작하기</button>
        <button class="btn" style="flex:1 1 150px;min-width:0;background:#03C75A;color:#fff;font-weight:800" onclick="window.PLT.toast('네이버 로그인은 정식 오픈 때 만나요!')">💚 네이버로 시작하기</button>
      </div>
    </div>

    <!-- 마이페이지 -->
    <div id="myBox" style="display:none">
      <div class="panel rv" style="margin-bottom:18px">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div style="width:64px;height:64px;border-radius:20px;background:linear-gradient(150deg,var(--violet),var(--violet-deep));display:grid;place-items:center;font-size:2rem">🧑‍🚀</div>
          <div style="flex:1;min-width:200px">
            <p style="font-weight:900;font-size:1.2rem"><span id="myName">플레이어</span>님</p>
            <p class="px" style="color:var(--violet);font-size:.85rem" id="myLv">LV.1 루키</p>
          </div>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">로그아웃</button>
        </div>
        <div style="margin-top:18px">
          <div style="display:flex;justify-content:space-between;font-size:.8rem;color:var(--ink-faint);margin-bottom:6px"><span class="px">XP</span><span>다음 레벨까지 플레이!</span></div>
          <div class="xp"><i id="myXp" style="width:10%"></i></div>
        </div>
        <div class="stats" style="grid-template-columns:1fr 1fr;margin-top:20px">
          <div class="stat"><div class="num" id="myVisits">0회</div><p>누적 플레이</p></div>
          <div class="stat"><div class="num" id="myPoint">0P</div><p>보유 포인트</p></div>
        </div>
      </div>

      <div class="panel rv">
        <span class="hud plain px" style="color:var(--violet)">MY GAMES</span>
        <h2 class="d3" style="margin:8px 0 14px">내 예약 내역</h2>
        <div id="myList" style="display:flex;flex-direction:column;gap:10px"></div>
        <a class="btn btn-primary btn-block" href="booking.html" style="margin-top:16px">새 예약 만들기 ▶</a>
      </div>
    </div>

  </div>
</section>

<div id="site-footer"></div>
<script src="assets/app.js"></script>
</body>
</html>
